name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Apply Icons, Version & Orientation
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/mipmap-* android/app/src/main/res/
          sed -i 's/versionCode 1/versionCode 1/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          sed -i 's/android:name="com.getcapacitor.BridgeActivity"/android:name="com.getcapacitor.BridgeActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 时毅-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
